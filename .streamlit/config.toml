# active-theme: rose
[server]
port = 8501
runOnSave = true

# 테마: 로즈 — '도구 > 테마 바꾸기' 화면에서 바꾸면 아래가 다시 써진다 (utils/theme.py)
[theme]
base = "light"
primaryColor = "#BE185D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FDF2F6"
textColor = "#2A1520"
borderColor = "#F3DCE6"
linkColor = "#BE185D"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "16px"
buttonRadius = "16px"
font = "'Nanum Gothic':https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap"
baseFontSize = 17
headingFontSizes = ["32px", "24px", "20px", "18px", "17px", "16px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 700
linkUnderline = false
dataframeHeaderBackgroundColor = "#FDF2F6"
dataframeBorderColor = "#F3DCE6"

[theme.sidebar]
backgroundColor = "#FEF6F9"
secondaryBackgroundColor = "#FBE6EE"
textColor = "#2A1520"
borderColor = "#F3DCE6"
primaryColor = "#BE185D"
linkColor = "#BE185D"
