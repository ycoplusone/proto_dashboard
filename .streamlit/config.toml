# active-theme: contrast
[server]
port = 8501
runOnSave = true

# 테마: 고대비 — '도구 > 테마 바꾸기' 화면에서 바꾸면 아래가 다시 써진다 (utils/theme.py)
[theme]
base = "light"
primaryColor = "#0040C1"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#000000"
borderColor = "#8A8A8A"
linkColor = "#0040C1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
baseFontSize = 17
headingFontSizes = ["32px", "24px", "20px", "18px", "17px", "16px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 700
linkUnderline = false
dataframeHeaderBackgroundColor = "#F2F2F2"
dataframeBorderColor = "#8A8A8A"

[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#1F1F1F"
textColor = "#FFFFFF"
borderColor = "#5C5C5C"
primaryColor = "#0040C1"
linkColor = "#FFFFFF"
