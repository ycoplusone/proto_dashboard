# active-theme: ocean
[server]
port = 8501
runOnSave = true

# 테마: 오션 틸 — '도구 > 테마 바꾸기' 화면에서 바꾸면 아래가 다시 써진다 (utils/theme.py)
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EFF7F6"
textColor = "#102A2A"
borderColor = "#D6E9E6"
linkColor = "#0F766E"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "'IBM Plex Sans KR':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
baseFontSize = 17
headingFontSizes = ["32px", "24px", "20px", "18px", "17px", "16px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 700
linkUnderline = false
dataframeHeaderBackgroundColor = "#EFF7F6"
dataframeBorderColor = "#D6E9E6"

[theme.sidebar]
backgroundColor = "#F2F9F8"
secondaryBackgroundColor = "#E0F0EE"
textColor = "#102A2A"
borderColor = "#D6E9E6"
primaryColor = "#0F766E"
linkColor = "#0F766E"
