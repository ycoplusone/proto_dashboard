# active-theme: modern
[server]
port = 8501
runOnSave = true

# 테마: 모던 블루 — '도구 > 테마 바꾸기' 화면에서 바꾸면 아래가 다시 써진다 (utils/theme.py)
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1F2937"
borderColor = "#E6E8EC"
linkColor = "#2a78d6"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "12px"
font = "'Pretendard Variable':https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
baseFontSize = 15
headingFontSizes = ["30px", "22px", "18px", "16px", "15px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 700
linkUnderline = false
dataframeHeaderBackgroundColor = "#F4F6F9"
dataframeBorderColor = "#E6E8EC"

[theme.sidebar]
backgroundColor = "#F8F9FB"
secondaryBackgroundColor = "#EEF1F5"
textColor = "#1F2937"
borderColor = "#E6E8EC"
primaryColor = "#2a78d6"
linkColor = "#2a78d6"
